name: AMR pipeline validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the locked environment
        run: python -m pip install -r requirements.txt
      - name: Run leakage and feature-engineering tests
        run: python -m pytest
      - name: Compile all project modules
        run: python -m compileall -q src tests
