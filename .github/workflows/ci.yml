name: AMR pipeline validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the locked environment
        run: python -m pip install -r requirements.txt
      - name: Run leakage and feature-engineering tests
        run: python -m pytest
      - name: Compile all project modules
        run: python -m compileall -q src tests
      - name: Check economic documentation
        run: python src/check_economic_consistency.py
  r-economic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Test dependency-free R models
        run: Rscript tests/test_economic_model.R
      - name: Generate authoritative R analyses
        run: |
          Rscript R/run_economic_analysis.R
          Rscript R/run_budget_impact_analysis.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify R provenance and 50,000-draw output
        run: |
          python -m pip install pandas
          python src/check_economic_consistency.py --require-r
      - uses: actions/upload-artifact@v4
        with:
          name: authoritative-r-economic-results
          path: |
            outputs/economic_r/
            outputs/budget_impact_r/
