[project]
name = "regional-ecoli-amr"
version = "2.0.0"
description = "Research-grade country-level E. coli bloodstream AMR forecasting"
requires-python = "==3.12.*"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.8",
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "seaborn==0.13.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
